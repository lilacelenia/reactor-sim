# ---------------------------------------------------------------------------------------
# MITR-II-like research reactor core -- ILLUSTRATIVE configuration
#
# Geometry follows the published MITR-II layout: a hexagonal light-water core of 27
# rhomboid fuel positions in three rings (A: 3, B: 9, C: 15), plate fuel elements with a
# 56.83 cm fueled length, six borated-stainless shim blades (one per hexagon side, 53.34 cm
# travel), a cadmium regulating rod at one corner of the core, and a surrounding heavy-water
# reflector with graphite beyond it.
#
# Everything NOT published in an accessible source is an engineering estimate and is
# marked "estimate": element side length (from the ~60 mm flat-to-flat element width),
# tank/reflector radii, blade thickness, and ALL cross sections. The two-group cross
# sections are textbook-style homogenized values, not MITR data, so k-eff and critical
# blade height from this file are illustrative only.
# ---------------------------------------------------------------------------------------
name: MITR-II-like core (illustrative)

mesh:
  cell_size: 2.0          # cm, cubic cells
  half_width: 50.0        # cm, domain is a square prism [-50, 50] x [-50, 50]
  z_min: -16.0            # cm (fuel bottom is z = 0)
  z_max: 84.0
  subsamples: 4           # per axis per cell, used to compute material volume fractions

boundary:                 # all six faces
  type: albedo
  gamma: 0.5              # Marshak vacuum condition

core:
  lattice: hex_rhombus     # hexagon of side 3*s tiled by 27 rhombi (60/120 degree)
  element_side: 7.0        # cm, rhombus side incl. inter-element gap (estimate)
  fuel_bottom: 0.0         # cm
  fuel_height: 56.83       # cm, HEU fuel meat length 22.375 in (ANL/RERTR/TM-10-41, 2.2)
  default_element: fuel
  # Position names follow the MITR facility (ANL/RERTR/TM-10-41, Fig. 2-7): per ring,
  # clockwise seen from the top, starting at the regulating-rod corner. The three A-ring
  # rhombi are turned 60 degrees from the B/C sector tiling, as in the figure (A1 points at
  # the regulating rod; A2, A3 follow clockwise).
  position_numbering: mitr
  inner_ring_rotated: true
  # Reference loading: MITR-II HEU core 2 (first critical 9 Mar 1976; TM-10-41 2.3.2 and
  # Table 4-1): 22 fresh elements, five solid aluminum dummies, no fixed absorbers.
  # Not modeled: the Cd blades present at the start of core 2 (replaced one at a time with
  # ~1 % boron BSS blades during the core); all six are modeled as BSS here.
  positions:
    A-2: dummy_al
    A-3: dummy_al
    B-3: dummy_al
    B-6: dummy_al
    B-9: dummy_al

surroundings:
  core_fill: h2o           # water around/above/below elements inside the core tank
  tank_radius: 24.0        # cm, H2O region radius (estimate)
  reflector:
    material: d2o
    outer_radius: 45.0     # cm (estimate)
  beyond_reflector: graphite
  below_core: h2o          # axial regions inside the tank radius
  above_core: h2o

control:
  shim_bank:
    type: hex_side_blades
    sides: [0, 1, 2, 3, 4, 5]
    gap: 0.4               # cm between hexagon flat and blade (estimate)
    thickness: 0.6         # cm (estimate)
    material: blade
    travel: 53.34          # cm, published: 21 in (TM-10-41 2.3: tips 10.25 in below to 10.75 in
                           # above the reactor median plane)
    inserted_tip_above_fuel_bottom: 2.38  # cm. Published: inserted tips 10.25 in below the
                           # median plane. Estimate: the median plane is taken as the fuel-meat
                           # centre (28.415 cm), so 28.415 - 26.035 = 2.38 cm. Bank heights
                           # ('withdrawn') are measured from this inserted position, like MITR's.
    withdrawn: 21.08       # cm, current position (0 = fully inserted)
    # Published values for HEU core 2 (ANL/RERTR/TM-10-41). verify_blades.py fits
    # materials.blade.Sa2 (Sa1 = Sa1_over_Sa2 * Sa2) and the fuel nSf1/nSf2 scale to the
    # first two; everything else is an independent check.
    published:
      critical_height_in: 8.3         # fit target: measured core 2 BOC critical bank height
                                      # (Table 4-2; Table 4-1 gives 8.6, the 2010 RERTR paper 8.5)
      single_blade_worths_pcm: [2222.0, 2161.0, 2161.0, 2377.0, 2377.0, 2222.0]
                                      # MITR blades 1-6, measured or symmetric (Table 4-6); fit
                                      # target: their mean, 2253 pcm. Individual values: check
      pcm_per_beta: 786.0             # 9927 pcm / 12.63 beta, as the HEU SAR converts
      shutdown_margin_pct: [3.35, 3.49, 3.56, 3.55, 3.50, 3.37]
                                      # MITR blades 1-6 stuck out, others in, reg rod out:
                                      # MCNP for core 2 (Table 4-11), NOT measured
      shutdown_margin_min_pct: 1.0    # tech-spec minimum
      bank_worth_pcm:                 # integral shim bank worth -- sources disagree:
        mcnp_core2: 12642.0           #   MCNP core 2 (Table 4-8)
        startup_report: [13362.0, 15120.0]  # 1975-76 startup report (quoted in TM-10-41)
        heu_sar: 9927.0               #   HEU SAR Table 4-4 (core not stated)
      excess_reactivity_beta_modern: [6.0, 7.0]  # "typical" for modern burned cores, not
                                      # core 2 (fresh, more fuel); shown for context only
    Sa1_over_Sa2: 0.03     # blade fast/thermal absorption ratio kept in the fit (estimate)
    cusping_flux_ratio: 0.15  # rodded/unrodded flux ratio for partially rodded cells;
                              # 1.0 = plain volume weighting (strong rod cusping)
    drive_speed: 0.2       # cm/s, normal motor-driven speed (estimate)
    scram_speed: 60.0      # cm/s, full-travel drop in ~0.9 s (published: blades drop in < 1 s)
  regulating_rod:
    # Published (MITR): one regulating rod, cadmium on an aluminum rod; a low-worth device
    # used to hold power, moved by hand or by an automatic controller; no scram capability
    # (tech specs ML102320068, 1.3.31). It stands at a corner of the core hexagon, between
    # shim blades 1 and 6 (MITR core maps; ANL HEU/LEU benchmark report, ANL pub. 68856).
    # Integral worth, measured: core 2, bank at 8.5 in: 228 pcm; core 1: 134 pcm (bank 7.5 in)
    # and 269 pcm (16.8 in) (TM-10-41 Tables 4-9, 4-10). HEU SAR: 124 pcm (core not stated).
    # Tech-spec limits (3.2.2): a device on an automatic controller may hold < 0.5 % dk/k of
    # available positive reactivity; controlled insertion rate < 5e-4 dk/k/s.
    # Estimates: which corner (program convention), radial position, radius, travel, drive
    # speed, the nominal position, and the equivalent absorber constants (material reg_rod),
    # whose Sa2 makes the rod nearly black (cadmium). Not fitted to core 2: even a black rod of
    # this (estimated) radius is worth only ~208 pcm at the core 2 critical bank vs the measured
    # 228 pcm, so verify_control.py compares instead (python3 verify_control.py calibrate
    # would fit Sa2 to published_worth_pcm when that is reachable).
    corner_angle: 330.0    # deg from +x: the corner between the blades on sides 0 and 5
                           # (MITR blades 6 and 1; Fig. 2-7). Program side s = MITR blade 6 - s
    radial_position: 23.0  # cm from the core axis (hexagon corner at 21 cm, tank wall at 24 cm)
    radius: 0.9            # cm (estimate)
    material: reg_rod
    travel: 53.0           # cm (estimate: same as the blades)
    withdrawn: 15.0        # cm, nominal position (estimate). Below the bank tip on purpose: the
                           # blades shadow the rod, so above the tip it is worth almost nothing
                           # (published MITR trend: its worth grows as the bank is withdrawn)
    drive_speed: 0.5       # cm/s (estimate; worth rate ~2 pcm/s, far below the tech-spec limit)
    published_worth_pcm: 228.0   # core 2, measured (TM-10-41 Table 4-10)

power_controller:
  # Automatic power controller driving the regulating rod (estimates: no MITR controller
  # description was found; the tech specs only require it to be separate from the safety
  # system, so it reads its own channel -- here the fission power -- not the trip channels).
  # Sampled-data period-demand law, every sample_period_s:
  #   x = ln(P / P_set),  w = (x - x_prev) / Ts  (measured inverse period),
  #   w* = clip(-x / approach_time_s, -1/min_period_down_s, 1/min_period_up_s),
  #   rod speed v = clip(rod_gain_cm * (w* - w), -v_max, v_max), v_max = rod drive speed.
  # In steady state w = 0 and v = 0, so P = P_set exactly (the rod position integrates).
  # Gains tuned on point kinetics: rod_gain * (max reg-rod worth per cm) / beta ~ 0.3 keeps
  # the sampled loop from chattering; ~10 % overshoot of a setpoint step at zero power,
  # ~1 % at power (feedback damps it). It switches to manual on a scram.
  sample_period_s: 1.0
  approach_time_s: 30.0
  rod_gain_cm: 22.0           # cm of rod per (1/s) of inverse-period error, i.e. (cm/s)/(1/s);
                              # 40 before the blade refit, scaled by the change in rod
                              # differential worth at the nominal position (5.2 -> 9.3 pcm/cm)
  min_period_up_s: 30.0       # power is never raised faster than this period
  min_period_down_s: 30.0

kinetics:
  beta: [0.000215, 0.001424, 0.001274, 0.002568, 0.000748, 0.000273]  # Keepin, U-235 thermal
  decay_constants: [0.0124, 0.0305, 0.111, 0.301, 1.14, 3.01]         # 1/s
  velocities: [1.0e+7, 2.5e+5]     # cm/s, fast and thermal group (typical two-group values)
  # Not modeled: photoneutrons from the D2O reflector (extra, very long-lived delayed groups)

transient:                 # scenario for run_transient.py
  method: pcqs             # pcqs (recommended) | adiabatic | direct
  start_height: 21.08      # cm; the critical bank height (2 cm mesh, regulating rod at 15 cm)
  initial_power_w: 1.0e+6   # starts in steady state at this power (temperatures included)
  feedback: true           # thermal feedback (needs the thermal_hydraulics section)
  end_time: 640.0          # s
  dt_max: 10.0             # s, largest time step (steps shrink automatically when needed)
  dh_max: 1.0              # cm, largest blade travel per step
  trip_power_w: null       # automatic high-power scram setpoint (null = off)
  commands:                # 'move' is relative to start_height
    - {time: 10.0, move: +0.1}     # small withdrawal: power rises, feedback levels it off
    - {time: 600.0, scram: true}   # manual scram
    # other commands: {time: t, target: 30.0}, {time: t, inlet_temperature: 315.15},
    #                 {time: t, reg_rod: 20.0}   (regulating rod target, manual)
    #                 {time: t, auto: true, setpoint_w: 1.2e+6}  (automatic power control on;
    #                  setpoint_w optional: default = power at that moment), {time: t, auto: false}
    #                 {time: t, flow: 0.8}   (pump speed target, relative; flow follows)
    #                 {time: t, pumps: 0}    (pumps running: 0 trips both -> coastdown)

materials:                 # two-group constants, cm and 1/cm (illustrative)
  fuel:                    # homogenized HEU Al-clad plate element + coolant channels,
    D1: 1.33               # textbook-style values; nSf fitted to fresh HEU core 2
    D2: 0.28
    Sa1: 0.0030
    Sa2: 0.290
    Ss12: 0.0270
    nSf1: 0.002691444      # fitted with the blades: 1.044329 x the previous fit (0.0025772,
    nSf2: 0.506204         # 0.484717) so the bank is critical at the measured core 2 8.3 in
  dummy_al:                # solid aluminum element
    D1: 1.60
    D2: 3.40
    Sa1: 0.0005
    Sa2: 0.0139
    Ss12: 0.0003
    nSf1: 0.0
    nSf2: 0.0
  h2o:
    D1: 1.13
    D2: 0.16
    Sa1: 0.0004
    Sa2: 0.0197
    Ss12: 0.0494
    nSf1: 0.0
    nSf2: 0.0
  d2o:
    D1: 1.31
    D2: 0.87
    Sa1: 0.00001
    Sa2: 0.00008
    Ss12: 0.0110
    nSf1: 0.0
    nSf2: 0.0
  graphite:
    D1: 1.02
    D2: 0.84
    Sa1: 0.00001
    Sa2: 0.00027
    Ss12: 0.0028
    nSf1: 0.0
    nSf2: 0.0
  reg_rod:                 # cadmium: strong thermal absorber, nearly transparent to fast
    D1: 1.00               # neutrons. "Equivalent" constants like the blades'; Sa2 is
    D2: 0.30               # set nearly black (see control.regulating_rod)
    Sa1: 0.005
    Sa2: 17.3035           # earlier fit to the SAR 124 pcm; ~197 pcm in core 2 (2 cm mesh)
    Ss12: 0.0
    nSf1: 0.0
    nSf2: 0.0
  blade:                   # borated stainless steel. A thin near-black absorber is outside
    D1: 1.00               # diffusion theory's validity, so these are "equivalent" values.
    D2: 0.30               # Sa2 is FITTED (with the fuel nSf) to the measured core 2 mean
    Sa1: 0.0521825         # single-blade worth 2253 pcm and critical height 8.3 in, 2 cm mesh
    Sa2: 1.73942           # (python3 verify_blades.py calibrate); Sa1 = 0.03 Sa2 (estimate)
    Ss12: 0.0
    nSf1: 0.0
    nSf2: 0.0

thermal_hydraulics:        # one coolant channel per fuel element, upward flow
  inlet_temperature: 313.15        # K, 40 C (estimate)
  total_flow_kg_s: 126.2           # 2000 gpm: published normal flow (2003 MITR loss-of-flow
                                   # analysis, NRC ML081000627); LSSS minimum is 1800 gpm
  fuel_flow_fraction: 0.9          # share passing through fuel elements (estimate)
  per_element:                     # whole element over its 57 cm fueled length (estimates)
    plate_heat_capacity_j_k: 1900      # 15 Al-clad plates, ~2 kg
    coolant_heat_capacity_j_k: 4200    # ~1 kg of water in the channels
    hA_w_k: 18000                      # plate-to-water conductance incl. fins (h ~ 12 kW/m2K)
  rated_power_w: 6.0e+6             # published HEU licensed power (for reference)

decay_heat:
  # Published standard: ANS-5.1-1979 decay heat for thermal fission of U-235, 23-group fit
  # (as tabulated in the NRC WCOBRA/TRAC models report, ML050910161, Table 8-1).
  # Infinite-irradiation fraction: 6.6 % at shutdown, 4.4 % after 16 s, 2.5 % after 300 s.
  # Not included: actinide (U-239/Np-239) decay heat (small for 93 % HEU) and the ~7 % of
  # decay energy that gammas deposit outside the fuel (all of it heats the plates here).
  # The initial state is equilibrium after long operation at the starting power (estimate;
  # MITR runs continuously for weeks).
  energy_per_fission_mev: 200.0    # recoverable energy per fission (same as kinetics)
  alpha_mev_per_fission_s: [6.5057e-01, 5.1264e-01, 2.4384e-01, 1.3850e-01, 5.5440e-02,
                            2.2225e-02, 3.3088e-03, 9.3015e-04, 8.0943e-04, 1.9567e-04,
                            3.2535e-05, 7.5595e-06, 2.5232e-06, 4.9948e-07, 1.8531e-07,
                            2.6608e-08, 2.2398e-09, 8.1641e-12, 8.7797e-11, 2.5131e-14,
                            3.2176e-16, 4.5038e-17, 7.4791e-17]
  lambda_per_s: [2.2138e+01, 5.1587e-01, 1.9594e-01, 1.0314e-01, 3.3656e-02, 1.1681e-02,
                 3.5870e-03, 1.3930e-03, 6.2630e-04, 1.8906e-04, 5.4988e-05, 2.0958e-05,
                 1.0010e-05, 2.5438e-06, 6.6361e-07, 1.2290e-07, 2.7213e-08, 4.3714e-09,
                 7.5780e-10, 2.4786e-10, 2.2384e-13, 2.4600e-14, 1.5699e-14]

primary_loop:
  # Published (MITR): two primary pumps in parallel; flow down the tank wall and up through
  # the core; four natural convection valves (NCVs, ball valves) that open by themselves
  # when forced flow stops, plus two anti-siphon valves (not modeled: conservative); a
  # hexagonal flow guide ~76 cm high above the core (LEU PSAR ML17345A518, sec. 4.2).
  # Tech specs (ML102320068): 1800 gpm min with 2 pumps, 900 gpm with 1 pump, 100 kW max
  # with none. Everything else here is an estimate -- no MITR pump coastdown data was found.
  pumps: 2                         # published
  pump_head_pa: 2.0e+5             # estimate, both pumps at full speed
  core_pressure_drop_pa: 2.0e+4    # estimate, at nominal flow (turbulent, ~ W^2)
  coastdown_time_constant_s: 3.0   # estimate (no flywheel): tau dw/dt = -(w^2 + f) after a trip
  pump_friction_ratio: 0.05        # estimate f: friction / full-speed hydraulic torque; with tau
                                   # the pumps stop ~18 s after a trip. (Published MITR analyses
                                   # show the second temperature peak ~16 s after loss of flow;
                                   # here the flow minimum comes later, ~60 s: see README)
  spinup_time_constant_s: 2.0      # estimate
  inertia_core_per_m: 20.0         # estimate, sum of L/A: core channels and plenums
  inertia_pump_loop_per_m: 1200.0  # estimate: ~60 m of ~25 cm pipe, heat exchanger, tank annulus
  inertia_ncv_per_m: 100.0         # estimate
  chimney_height_m: 0.76           # published flow-guide height above the core (LEU PSAR)
  pump_loop_drop_m: 4.0            # estimate: the hot leg runs down from the tank outlet to the
                                   # heat exchangers, so the stopped pump loop opposes natural
                                   # circulation (which then goes through the NCVs)
  check_valve_reverse_factor: 1.0e+4  # estimate: reverse-flow resistance / forward (check valves)
  natural_convection_valves: 4     # published
  nc_calibration:
    # Published MULCH-II result (LEU PSAR Table 4-18, NCVs only): 1.35 kg/s through the core
    # at 100 kW with 60 C inlet, uniform axial power. The NCV path resistance is set so this
    # model reproduces it under the same conditions (taken as the flow through the fuel
    # channels; the 10 % bypass is added on top). That analysis is for the LEU core; using
    # it for this HEU-like core is an estimate.
    power_w: 1.0e+5
    inlet_temperature_c: 60.0
    core_flow_kg_s: 1.35

feedback:                  # fractional change of each cross section per kelvin (estimates)
  reference_temperature: 313.15    # temperature the material constants above describe
  materials:
    fuel:                          # homogenized element = plates + channel water
      coolant_temperature:         # water expands and the spectrum hardens as it heats;
        D1: 1.8e-4                 # scaled to give ~ -12 pcm/K, typical of plate-fuel
        D2: 1.8e-4                 # research cores (the exact MITR value is not used here)
        Ss12: -2.4e-4
        Sa2: -4.8e-4
        nSf2: -4.8e-4
      fuel_temperature:            # Doppler; weak because HEU has little U-238
        Sa1: 3.0e-5

source:                    # startup neutron source (alpha-n), emits fast neutrons
  type: Pu-Be              # published: MITR uses a Pu-Be source
  strength_n_s: 1.0e+7     # estimate (a few curies of Pu); the MITR value was not found
  position: [0.0, -22.5, 28.5]   # cm (estimate): water gap just outside a core vertex, mid-height
  radius: 1.5              # cm; spread over the cells within this radius

startup:
  start_height: 0.0        # blades fully inserted
  # published MITR practice: raise the blades in 0.1 inch (0.254 cm) increments until
  # critical, never more than 0.5 inch above the estimated critical position (ECP)

instrumentation:
  # Published: channels 1-2 fission chambers for startup (switched to ion chambers ~1 kW,
  # ineffective above ~5 kW); channel 3 ion chamber on scale from ~500 W; channels 1-3
  # short-period scram; channels 4-6 high-flux scram, 5-6 with low-range amplifiers below
  # 100 kW; trips below. Detector positions, sensitivities, dead time and meter time
  # constants are estimates. The real detector ports are ~4-5 ft from the core, outside
  # this model's 50 cm domain, so the detectors sample the flux at the domain edge instead.
  calibration_height: 21.08        # cm; signals read true power at this critical state
  detectors:
    lower_port: {position: [44.0, 0.0, -10.0], radius: 3.0}   # stands in for port 4IH (below, outside)
    side_port:  {position: [-44.0, 0.0, 28.5], radius: 3.0}
    upper_port: {position: [0.0, 0.0, 78.0], radius: 3.0}     # stands in for port 3GV (above)
  channels:
    # fission chamber sensitivity chosen so the shutdown count rate (blades in, source in)
    # is a few cps; with the dead time, counting losses are ~17 % at 1 kW and ~50 % at 5 kW
    - {name: "Ch 1", kind: fission_chamber, detector: lower_port, period: true,
       full_scale_w: 5.0e+3, full_scale_cps: 5.0e+7, dead_time_s: 2.0e-8, min_cps: 0.1}
    - {name: "Ch 2", kind: fission_chamber, detector: side_port, period: true,
       full_scale_w: 5.0e+3, full_scale_cps: 5.0e+7, dead_time_s: 2.0e-8, min_cps: 0.1}
    - {name: "Ch 3", kind: ion_chamber, detector: upper_port, period: true,
       on_scale_w: 500.0, period_on_scale_w: 500.0}
    - {name: "Ch 4", kind: ion_chamber, detector: lower_port, power: true, on_scale_w: 1.0e+4}
    - {name: "Ch 5", kind: ion_chamber, detector: side_port, power: true, on_scale_w: 100.0}
    - {name: "Ch 6", kind: ion_chamber, detector: upper_port, power: true, on_scale_w: 100.0}
  trips:
    short_period_s: 10.0           # published
    high_power_w: 6.5e+6           # published
    high_power_no_flow_w: 8.0e+4   # published (no primary flow)
    no_flow_below: 0.05            # relative flow counted as "no flow" (estimate)
    low_flow_relative: 0.9         # published low-flow scram setpoint, 1800 of 2000 gpm (both
                                   # pumps); armed above high_power_no_flow_w (simplification of
                                   # the tech-spec pump-mode logic; 1-pump mode not modeled)
  period_meter_time_constant_s: 3.0     # estimate (log/period amplifiers filter over seconds;
                                        # 1 s made single 0.1-inch steps near critical trip)
  count_rate_meter_time_constant_s: 2.0 # estimate
